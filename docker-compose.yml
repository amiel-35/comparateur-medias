# Déploiement Coolify (type « Docker Compose »). Coolify fournit les domaines et le HTTPS (Traefik) : aucun port
# n'est exposé sur l'hôte. Deux services, la même image, deux commandes (docs/cadrage-long-terme.md, phase 2) :
#   fabrique  récolte les flux, fait l'édition, écrit le tiroir public. N'écoute aucun port. Tient la clé des modèles.
#   guichet   sert le site, compte.<domaine> et urne.<domaine> ; envoie les mails. Tient la clé d'envoi.
# Le volume comparateur-donnees (tiroir public) est partagé : la fabrique écrit, le guichet lit. Le volume
# comparateur-identites (identites.db) et comparateur-urnes (une urne par questionnaire) ne sont montés que sur le
# guichet : la fabrique ne peut pas les ouvrir. Trois sauvegardes distinctes ; une urne ne se sauvegarde qu'à sa clôture.
services:
  fabrique:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "python -m comparateur init && python -m comparateur pages && exec python -m comparateur fabrique"]
    environment:
      # Secret : à saisir dans Coolify (Environment Variables), jamais dans ce fichier.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?clé API Anthropic requise pour la fabrique}
      # Récolte des flux toutes les N minutes, et une édition par jour à l'heure indiquée (heure de Paris).
      COMPARATEUR_FABRIQUE_MINUTES: ${COMPARATEUR_FABRIQUE_MINUTES:-180}
      COMPARATEUR_EDITION_HEURE: ${COMPARATEUR_EDITION_HEURE:-6}
      COMPARATEUR_BUDGET_JOUR_USD: ${COMPARATEUR_BUDGET_JOUR_USD:-2}
      COMPARATEUR_HEURES: ${COMPARATEUR_HEURES:-24}
      # Rubriques écartées des sujets, lues dans l'adresse de l'article (« aucune » pour ne rien écarter).
      COMPARATEUR_RUBRIQUES_ECARTEES: ${COMPARATEUR_RUBRIQUES_ECARTEES:-sport,culture}
      COMPARATEUR_MIN_PAR_BORD: ${COMPARATEUR_MIN_PAR_BORD:-5}
      COMPARATEUR_UMAMI_ID: ${COMPARATEUR_UMAMI_ID:-}
      COMPARATEUR_SITE_URL: ${COMPARATEUR_SITE_URL:-}
      # La fabrique ne lit pas les secrets SMTP. Elle doit seulement savoir si le mail est en service, pour afficher
      # ou non le formulaire et le lien du compte : COMPARATEUR_MAIL_EN_SERVICE=1 quand le guichet a ses réglages SMTP.
      COMPARATEUR_MAIL_EN_SERVICE: ${COMPARATEUR_MAIL_EN_SERVICE:-}
    volumes:
      - comparateur-donnees:/data
    healthcheck:
      disable: true

  guichet:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "comparateur", "guichet"]
    expose:
      - "8080"
    environment:
      COMPARATEUR_MIN_PAR_BORD: ${COMPARATEUR_MIN_PAR_BORD:-5}
      COMPARATEUR_UMAMI_ID: ${COMPARATEUR_UMAMI_ID:-}
      COMPARATEUR_SITE_URL: ${COMPARATEUR_SITE_URL:-}
      # Le mail (Brevo, SMTP) et le compte. Sans utilisateur ou sans mot de passe : ni formulaire, ni compte, ni envoi.
      # Le mot de passe (clé SMTP de Brevo) est un secret : à saisir dans Coolify, jamais dans ce fichier.
      COMPARATEUR_SMTP_UTILISATEUR: ${COMPARATEUR_SMTP_UTILISATEUR:-}
      COMPARATEUR_SMTP_MOT_DE_PASSE: ${COMPARATEUR_SMTP_MOT_DE_PASSE:-}
      COMPARATEUR_SMTP_HOTE: ${COMPARATEUR_SMTP_HOTE:-}
      COMPARATEUR_SMTP_PORT: ${COMPARATEUR_SMTP_PORT:-}
      COMPARATEUR_MAIL_EXPEDITEUR: ${COMPARATEUR_MAIL_EXPEDITEUR:-}
      # Les noms d'hôte du compte et de l'urne. Par défaut : compte.<hôte du site> et urne.<hôte du site>.
      COMPARATEUR_HOTE_COMPTE: ${COMPARATEUR_HOTE_COMPTE:-}
      COMPARATEUR_HOTE_URNE: ${COMPARATEUR_HOTE_URNE:-}
      COMPARATEUR_IDENTITES: /identites
      # Les urnes du panel : un fichier par questionnaire, dans un volume à part. Sauvegardé à la clôture seulement.
      COMPARATEUR_URNES: /urnes
    volumes:
      - comparateur-donnees:/data
      - comparateur-identites:/identites
      - comparateur-urnes:/urnes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  comparateur-donnees:
  comparateur-identites:
  comparateur-urnes:
