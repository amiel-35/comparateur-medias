# Déploiement Coolify (type « Docker Compose »). Coolify fournit le domaine et le HTTPS (Traefik) :
# on n'expose aucun port sur l'hôte, on déclare seulement le port interne du service.
services:
  comparateur:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Secret : à saisir dans Coolify (Environment Variables), jamais dans ce fichier.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?clé API Anthropic requise pour la fabrique}
      # La fabrique tourne dans le même conteneur : récolte des flux toutes les N minutes (0 = fabrique coupée),
      # et une édition par jour à l'heure indiquée (heure de Paris).
      COMPARATEUR_FABRIQUE_MINUTES: ${COMPARATEUR_FABRIQUE_MINUTES:-180}
      COMPARATEUR_EDITION_HEURE: ${COMPARATEUR_EDITION_HEURE:-6}
      COMPARATEUR_BUDGET_JOUR_USD: ${COMPARATEUR_BUDGET_JOUR_USD:-2}
      COMPARATEUR_HEURES: ${COMPARATEUR_HEURES:-24}
      # Rubriques écartées des sujets, lues dans l'adresse de l'article (« aucune » pour ne rien écarter).
      COMPARATEUR_RUBRIQUES_ECARTEES: ${COMPARATEUR_RUBRIQUES_ECARTEES:-sport,culture}
      COMPARATEUR_MIN_PAR_BORD: ${COMPARATEUR_MIN_PAR_BORD:-5}
      # Mesure de fréquentation par Umami, sans cookie : le data-website-id du site dans Umami. Vide : aucune mesure.
      COMPARATEUR_UMAMI_ID: ${COMPARATEUR_UMAMI_ID:-}
      # La synthèse de la semaine par mail (Brevo, SMTP). Sans utilisateur ou sans mot de passe : fonction éteinte.
      # Le mot de passe (clé SMTP de Brevo) est un secret : à saisir dans Coolify, jamais dans ce fichier.
      COMPARATEUR_SMTP_UTILISATEUR: ${COMPARATEUR_SMTP_UTILISATEUR:-}
      COMPARATEUR_SMTP_MOT_DE_PASSE: ${COMPARATEUR_SMTP_MOT_DE_PASSE:-}
      COMPARATEUR_SMTP_HOTE: ${COMPARATEUR_SMTP_HOTE:-}
      COMPARATEUR_SMTP_PORT: ${COMPARATEUR_SMTP_PORT:-}
      COMPARATEUR_MAIL_EXPEDITEUR: ${COMPARATEUR_MAIL_EXPEDITEUR:-}
      COMPARATEUR_MAIL_NOM: ${COMPARATEUR_MAIL_NOM:-}
      COMPARATEUR_SITE_URL: ${COMPARATEUR_SITE_URL:-}
    volumes:
      - comparateur-donnees:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  comparateur-donnees:
