<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cadrages : l’actualité du 14 novembre</title>
<style>
:root{
  --bg:#f1ede4;--paper:#fbf9f4;--ink:#16140f;--mute:#5b564b;--line:#cfc8b6;--hl:#f2c230;--hl-on:#16140f;
  --g:#b8203b;--on-g:#fff;--cg:#e8879c;--on-cg:#16140f;--c:#666a76;--on-c:#fff;--cd:#8fb0ea;--on-cd:#16140f;--d:#1d4fb3;--on-d:#fff;
  --ko:#9a2a1a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14130f;--paper:#1d1b16;--ink:#efe9da;--mute:#aaa392;--line:#403b2f;--hl:#f2c230;--hl-on:#16140f;
    --g:#ff4d70;--on-g:#14130f;--cg:#f2a3b5;--on-cg:#14130f;--c:#a7abb8;--on-c:#14130f;--cd:#8db3ff;--on-cd:#14130f;--d:#6f9bff;--on-d:#14130f;
    --ko:#ff9c8a;
  }
}
:root[data-theme="dark"]{
  --bg:#14130f;--paper:#1d1b16;--ink:#efe9da;--mute:#aaa392;--line:#403b2f;--hl:#f2c230;--hl-on:#16140f;
  --g:#ff4d70;--on-g:#14130f;--cg:#f2a3b5;--on-cg:#14130f;--c:#a7abb8;--on-c:#14130f;--cd:#8db3ff;--on-cd:#14130f;--d:#6f9bff;--on-d:#14130f;
  --ko:#ff9c8a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:hidden}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0;overflow-wrap:anywhere}
h1{font-size:clamp(1.9rem,6vw,3.4rem);letter-spacing:-.01em}
h2{font-size:clamp(1.3rem,3.4vw,1.8rem);margin:2.2rem 0 .8rem}
h3{font-size:1.1rem}
p{margin:.5em 0;overflow-wrap:anywhere}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* en-tête */
.top{border-bottom:2px solid var(--ink);background:var(--bg);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--serif);font-weight:800;font-size:1.25rem;text-decoration:none;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:34px;height:14px;background:var(--ink)}
nav.main{display:flex;flex-wrap:wrap;gap:2px 4px;order:3;width:100%}
nav.main a{font-size:.88rem;padding:6px 8px;text-decoration:none;border-bottom:3px solid transparent;font-weight:600}
nav.main a[aria-current="page"]{border-bottom-color:var(--hl)}
.tools{display:flex;gap:8px}
.btn{border:2px solid var(--ink);background:var(--paper);padding:8px 12px;font-weight:700;font-size:.9rem;border-radius:0;min-height:40px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.hl{background:var(--hl);color:var(--hl-on);border-color:var(--ink)}
.btn.hl:hover{background:var(--ink);color:var(--hl)}
.btn.sm{padding:5px 9px;font-size:.82rem;min-height:32px}
@media (min-width:760px){ .top{position:sticky;top:0} nav.main{order:0;width:auto} .top .wrap{flex-wrap:nowrap} .brand{margin-right:12px} nav.main{margin-right:auto} }

main{padding-bottom:64px;min-height:70vh}
main:focus,h1:focus{outline:none}

/* tags */
.mdl{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--mute);color:var(--mute);vertical-align:middle;white-space:nowrap;margin-left:6px;font-weight:400;font-style:normal}
.nomdl{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--ink);vertical-align:middle;white-space:nowrap}
.soon{display:inline-block;font-family:var(--mono);font-size:.74rem;padding:1px 8px;border:1px dashed var(--mute);color:var(--mute)}
.bchip{display:inline-block;padding:1px 8px;font-size:.78rem;font-weight:700;line-height:1.5;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.b-gauche{background:var(--g);color:var(--on-g)}.b-centre-gauche{background:var(--cg);color:var(--on-cg)}.b-centre{background:var(--c);color:var(--on-c)}.b-centre-droit{background:var(--cd);color:var(--on-cd)}.b-droite{background:var(--d);color:var(--on-d)}
.f-g{background:var(--g);color:var(--on-g)}.f-c{background:var(--c);color:var(--on-c)}.f-d{background:var(--d);color:var(--on-d)}

/* hero */
.hero{padding:34px 0 10px;border-bottom:1px solid var(--line)}
.hero .lede{font-family:var(--serif);font-size:clamp(1.1rem,2.6vw,1.45rem);max-width:46ch;margin:14px 0 18px}
.hero .row{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:.88rem;color:var(--mute);max-width:70ch}
.ed{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 4px}
.ed .btn{text-decoration:none;white-space:nowrap}
.ed .btn.off{opacity:.3;cursor:default}
.ed-j{font-family:var(--mono,monospace);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;order:-1;flex:1 0 100%}
@media (min-width:720px){.ed-j{order:0;flex:1 1 auto;text-align:center}}
.ed-s{margin:0 0 14px;font-size:.78rem}
.ptop{list-style:none;counter-reset:pt;padding:0;margin:14px 0 26px;max-width:78ch}
.ptop li{counter-increment:pt;position:relative;padding:12px 0 12px 2.6rem;border-bottom:1px solid var(--line)}
.ptop li::before{content:counter(pt);position:absolute;left:0;top:10px;font-family:var(--serif);font-weight:700;font-size:1.5rem}
.ptop a{font-family:var(--serif);font-size:1.12rem;font-weight:700}
.ptop .pm{display:block;margin:4px 0 6px;font-size:.72rem}
.pbar{display:flex;gap:2px;height:20px;max-width:26rem}
.pbar i{display:flex;align-items:center;justify-content:center;min-width:2.6rem;font-style:normal}
.pbar i b{font-family:var(--mono,monospace);font-size:.68rem;font-weight:700}
.pbar .f-g{background:var(--g);color:var(--on-g)}.pbar .f-c{background:var(--c);color:var(--on-c)}.pbar .f-d{background:var(--d);color:var(--on-d)}
.pbar i.nul{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);color:var(--mute);outline:1px dashed var(--mute);outline-offset:-1px}
.pk{margin:0 0 10px}
.pl{list-style:none;padding:0;margin:4px 0 14px}
.pl li{padding:5px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.ptw{overflow-x:auto;max-width:100%;margin:10px 0}
.pt{border-collapse:collapse;width:100%;max-width:60rem;font-size:.92rem}
.pt th,.pt td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pt thead th{font-family:var(--mono,monospace);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid var(--ink)}
.eds{list-style:none;padding:0;margin:18px 0;max-width:60ch}
.eds li{border-bottom:1px solid var(--line);padding:10px 0;font-family:var(--serif);font-size:1.15rem}
.eds a[aria-current]{font-weight:700}
.why{border:3px solid var(--ink);background:var(--paper);margin:22px 0 6px;max-width:74ch}
.why summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;cursor:pointer;list-style:none;min-height:44px}
.why summary::-webkit-details-marker{display:none}
.why summary:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.why-t{font-family:var(--serif);font-weight:700;font-size:clamp(1.25rem,3.4vw,1.7rem);line-height:1.15}
.why-i::before{content:"+";font-family:var(--mono,monospace);font-size:1.6rem;line-height:1}
.why[open] .why-i::before{content:"\2212"}
.why[open] summary{border-bottom:1px solid var(--line)}
.why p{font-family:var(--serif);font-size:clamp(1.02rem,2.2vw,1.2rem);margin:12px 18px 0;max-width:none}
.why p.note{font-family:inherit;font-size:.88rem;margin:12px 18px 16px}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--mute);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

/* grille de sujets */
.grid{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column;height:100%;position:relative}
.card a.cover{display:flex;flex-direction:column;gap:8px;padding:14px;text-decoration:none;height:100%}
.card a.cover:hover h3{text-decoration:underline;text-decoration-thickness:2px}
.card .no{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card h3{font-size:1.15rem}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:auto;padding-top:6px}
.slot{position:relative;border:1px solid var(--line);padding:4px 6px 8px;min-height:58px;overflow:hidden}
.slot .lab{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.slot b{display:block;font-size:1.3rem;line-height:1.2;font-variant-numeric:tabular-nums}
.slot i{position:absolute;left:0;bottom:0;height:5px}
.slot.s-g i{background:var(--g)}.slot.s-c i{background:var(--c)}.slot.s-d i{background:var(--d)}
.slot.zero{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.slot.zero b{font-size:.8rem;font-family:var(--mono);text-transform:uppercase;color:var(--ko);padding-top:6px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.am{display:inline-block;font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;background:var(--ko);color:var(--paper);padding:2px 7px}
:root[data-theme="dark"] .am{color:#14130f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .am{color:#14130f}}
.dots{letter-spacing:2px;font-size:.9rem}

/* sujet */
.crumb{font-size:.85rem;margin:22px 0 10px}
.fait{background:var(--paper);border-left:8px solid var(--hl);padding:12px 16px;margin:16px 0}
.fait p{font-family:var(--serif);font-size:1.15rem;margin:.3em 0 0}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column;min-width:0}
.col>header{padding:8px 12px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.col.s-g>header{background:var(--g);color:var(--on-g)}.col.s-c>header{background:var(--c);color:var(--on-c)}.col.s-d>header{background:var(--d);color:var(--on-d)}
.col .body{padding:12px}
.angle{font-family:var(--serif);font-size:1.02rem;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.angle .lab{display:block;margin-bottom:4px}
.silence{border:2px dashed var(--ko);padding:12px;color:var(--ko);font-weight:700}
.silence span{display:block;font-weight:400;color:var(--mute);font-size:.88rem;margin-top:4px}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tlist li{min-width:0}
.tlist .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.mname{font-weight:700;font-size:.9rem}
.tlist a.t{font-family:var(--serif);font-size:1.02rem;line-height:1.3;display:block;overflow-wrap:anywhere}
details>summary{cursor:pointer;font-weight:700;font-size:.9rem;padding:8px 0;min-height:36px}
.mots{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.mots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mots li{background:var(--paper);border:1px solid var(--line);padding:10px 12px}
.mots q{font-family:var(--serif);font-size:1.2rem;quotes:none}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:34px}

/* classement */
.axis{margin:14px 0}
.cl{list-style:none;margin:0;padding:0}
.cl li{display:grid;grid-template-columns:minmax(0,7.4rem) minmax(0,1fr) 3.6rem;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.cl a{font-weight:700;font-size:.92rem;text-decoration:none;overflow-wrap:anywhere;line-height:1.2}
.cl a:hover{text-decoration:underline}
.track{position:relative;height:20px;background:repeating-linear-gradient(90deg,transparent 0 calc(100% - 1px),transparent 0)}
.track .zero{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.track .tick{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--mute);opacity:.7}
.track .bar{position:absolute;top:3px;height:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.cl .sc{font-family:var(--mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
.cl li.off a::after{content:" (flux illisible)";font-weight:400;color:var(--mute);font-size:.72rem}
.scale{display:grid;grid-template-columns:minmax(0,7.4rem) minmax(0,1fr) 3.6rem;gap:8px;font-family:var(--mono);font-size:.66rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.scale div:nth-child(2){position:relative;height:3.2em}
.scale span{position:absolute;white-space:nowrap}
.src{background:var(--paper);border:1px solid var(--line);padding:12px 14px;margin:14px 0}
.track .ci{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--ink);opacity:.75}
.track .ci::before,.track .ci::after{content:"";position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.track .ci::before{left:0}.track .ci::after{right:0}

/* médias */
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.mlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.mlist{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mlist a{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--c);padding:8px 10px;text-decoration:none;min-height:48px}
.mlist a:hover{border-color:var(--ink)}
.mlist .l-gauche{border-left-color:var(--g)}.mlist .l-centre-gauche{border-left-color:var(--cg)}.mlist .l-centre{border-left-color:var(--c)}.mlist .l-centre-droit{border-left-color:var(--cd)}.mlist .l-droite{border-left-color:var(--d)}
.mlist b{overflow-wrap:anywhere}
.mlist small{color:var(--mute);font-family:var(--mono);font-size:.72rem;text-align:right;flex:none}
.score{font-family:var(--serif);font-size:clamp(2.6rem,9vw,4.4rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin:0}
.kv>div{padding:10px 0;border-bottom:1px solid var(--line)}
@media (min-width:720px){.kv>div{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:16px}}
.kv dt{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.mini{position:relative;height:22px;margin:16px 0 4px;background:linear-gradient(90deg,var(--g),var(--cg) 28%,var(--c) 45%,var(--cd) 66%,var(--d));box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.mini i{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--ink);outline:2px solid var(--paper)}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tags a,.tags span.x{display:inline-block;border:1px solid var(--ink);padding:3px 8px;font-size:.85rem;text-decoration:none;background:var(--paper)}
.tags span.x{border-style:dashed;border-color:var(--mute);color:var(--mute)}
.masked{color:var(--mute);font-size:.9rem}

/* démarche */
.steps{list-style:none;counter-reset:s;margin:14px 0;padding:0;display:grid;gap:12px}
.steps li{counter-increment:s;background:var(--paper);border:2px solid var(--ink);padding:12px 14px 12px 58px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;font-family:var(--serif);font-size:2rem;font-weight:800;line-height:1}
.steps h3{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:4px}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:800px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two>div{background:var(--paper);border:1px solid var(--line);padding:12px 14px}
.two ul,.lim{margin:.4em 0;padding-left:1.2em}
.two li,.lim li{margin:.35em 0;overflow-wrap:anywhere}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media (min-width:720px){.nums{grid-template-columns:repeat(4,minmax(0,1fr))}}
.nums div{border:1px solid var(--line);background:var(--paper);padding:10px}
.nums b{display:block;font-family:var(--serif);font-size:1.9rem;line-height:1.1}
.nums span{font-size:.82rem;color:var(--mute)}
.origin{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:800px){.origin{grid-template-columns:repeat(2,minmax(0,1fr))}}
.origin article{background:var(--paper);border:2px solid var(--ink);padding:16px}
.origin .for{display:inline-block;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.72rem;padding:2px 8px;text-transform:uppercase;letter-spacing:.06em}
footer{border-top:2px solid var(--ink);padding:18px 0 40px;font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><i aria-hidden="true"></i>Cadrages</a>
    <div class="tools">
      <button class="btn sm" id="btnTheme" type="button" aria-label="Changer de thème">Thème</button>
    </div>
    <nav class="main" aria-label="Sections">
      <a href="#/" data-nav="home">Sujets</a>
      <a href="#/medias" data-nav="medias">Médias</a>
      <a href="#/classement" data-nav="classement">Classement</a>
      <a href="#/demarche" data-nav="demarche">Démarche</a>
      <a href="#/origine" data-nav="origine">Origine</a>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1"><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="foot"></div></footer>

<script id="donnees">
const DONNEES = /*DONNEES*/null;
const CLASSEMENT = DONNEES.classement;

</script>
<script id="app-js">
(function(){
'use strict';
var D=DONNEES,C=CLASSEMENT;
var GRP={'gauche':'g','centre-gauche':'g','centre':'c','centre-droit':'d','droite':'d'};
var GL={g:'Gauche',c:'Centre',d:'Droite'};
var BL={'gauche':'Gauche','centre-gauche':'Centre gauche','centre':'Centre','centre-droit':'Centre droit','droite':'Droite'};
var BORDS=['gauche','centre-gauche','centre','centre-droit','droite'];
var KEY='cadrages.v1';
var S={theme:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){S.theme=p.theme||null;}}}catch(_){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function url(u){return /^https?:\/\//i.test(u)?esc(u):'#';}
function fs(n){return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2).replace('.',',');}
function pl(n,a,b){return n+' '+(n>1?b:a);}
function bordOf(s){return s<=-1?'gauche':s<=-0.5?'centre-gauche':s>=1?'droite':s>=0.5?'centre-droit':'centre';}
function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return h>>>0;}
function enc(s){return encodeURIComponent(s);}

/* médias */
var lus={};D.medias.forEach(function(m){lus[m.nom]=m;});
var MEDIAS=C.medias.map(function(m){var l=lus[m.nom];return {nom:m.nom,score:m.score,note:m.note||null,lu:!!l,bord:l?l.bord:bordOf(m.score),ic:m.ic||null,sources:m.sources||null,peu:!!m.peu_documente};});
var BY={};MEDIAS.forEach(function(m){BY[m.nom]=m;});

/* sujets */
var rounds=D.sujets.map(function(s){return {id:s.id,kind:'sujet',titre:s.titre,fait:s.fait,div:s.divergence,analyse:s.analyse,mots:s.mots,arts:s.articles};});
rounds.push({id:'seuls',kind:'seuls',titre:'Les titres sans jumeau',fait:null,div:null,analyse:null,mots:[],arts:D.seuls});
var RB={};
rounds.forEach(function(r,i){
  r.n=i+1;RB[r.id]=r;
  r.arts=r.arts.map(function(a,k){var m=BY[a.media];return {media:a.media,titre:a.titre,lien:a.lien,k:k,bord:m.bord,grp:GRP[m.bord],score:m.score};});
  r.count={g:0,c:0,d:0};r.med={g:{},c:{},d:{}};
  r.arts.forEach(function(a){r.count[a.grp]++;r.med[a.grp][a.media]=1;});
  r.mortes=['g','c','d'].filter(function(x){return r.count[x]===0;});
  r.nmed=Object.keys(Object.assign({},r.med.g,r.med.c,r.med.d)).length;
});


/* éditions : une par jour, chacune sur sa page */

/* la semaine et le mois : des comptages sur les éditions gardées, sans modèle */
var PER=D.periodes||null;
function jourNum(j){return new Date(j+'T12:00:00Z').toLocaleDateString('fr-FR',{timeZone:'UTC',day:'numeric',month:'long'});}
function perTitre(p,type){
  if(type==='mois')return 'Le mois de '+new Date(p.debut+'T12:00:00Z').toLocaleDateString('fr-FR',{timeZone:'UTC',month:'long',year:'numeric'});
  return 'La semaine du '+jourNum(p.debut)+' au '+jourNum(p.fin)+' '+p.fin.slice(0,4);
}
function sujLien(x){return (x.dernier===ED.jour?'':edUrl(x.dernier))+'#/sujet/'+x.id;}
function vPeriode(type){

  var p=type==='mois'?PER.mois:PER.semaine, liste=type==='mois'?PER.mois_liste:PER.semaines;
  var i=liste.map(function(x){return x.cle;}).indexOf(p.cle), av=i>0?liste[i-1]:null, ap=i>=0&&i<liste.length-1?liste[i+1]:null;

     '<span class="ed-j">'+(type==='mois'?'Synthèse du mois':'Synthèse de la semaine')+'</span>'+

  h+='<p class="lede" style="font-family:var(--serif);font-size:1.2rem;max-width:58ch">Ce que les éditions de la période disent, mises bout à bout : les sujets les plus couverts, ce que chaque bord a traité, et ce qu’il a laissé de côté.</p>';
  h+='<p class="note">'+pl(p.jours.length,'édition gardée','éditions gardées')+' sur la période'+(p.jours.length<(type==='mois'?28:7)?' : la synthèse est partielle':'')+'. Tout est compté par une formule fixe, sans modèle de langage. Seuls les titres des sujets sont écrits par un modèle.</p>';
  h+='<div class="nums"><div><b>'+p.jours.length+'</b><span>'+(p.jours.length>1?'éditions':'édition')+'</span></div><div><b>'+p.sujets+'</b><span>sujets</span></div><div><b>'+p.titres+'</b><span>titres rangés</span></div><div><b>'+p.larges+'</b><span>sujets repris par '+p.min_medias+' médias ou plus</span></div></div>';
  /* les sujets les plus couverts */
  h+='<h2>Les sujets les plus couverts</h2><ol class="ptop">'+p.top.map(function(x){
    var mx=Math.max(x.par.g,x.par.c,x.par.d,1);
    return '<li><a href="'+sujLien(x)+'">'+esc(x.titre)+'</a>'+mdl()+'<span class="pm mono mute">'+pl(x.medias,'média','médias')+' · '+pl(x.titres,'titre','titres')+(x.jours>1?' · '+x.jours+' jours':'')+(x.ecart!=null?' · écart '+x.ecart+' sur 5':'')+'</span>'+
      '<span class="pbar" role="img" aria-label="Gauche '+x.par.g+', centre '+x.par.c+', droite '+x.par.d+'">'+['g','c','d'].map(function(c){return '<i class="f-'+c+(x.par[c]?'':' nul')+'" style="flex:'+Math.max(x.par[c],0.35)+'"><b>'+(x.par[c]||'aucun')+'</b></i>';}).join('')+'</span></li>';
  }).join('')+'</ol>';
  /* par bord */
  h+='<h2>Par bord</h2><p class="note">Un silence : un sujet repris par '+p.min_medias+' médias ou plus, sans aucun titre de ce bord.</p><div class="cols">';
  ['g','c','d'].forEach(function(c){
    var b=p.bords[c];
    h+='<section class="col s-'+c+'"><header><span>'+GL[c]+'</span><span class="mono" style="font-weight:400">'+pl(b.titres,'titre','titres')+'</span></header><div class="body">';

    h+='<p class="lab mono mute">Ce qu’il a le plus traité</p>'+(b.plus_couverts.length?'<ul class="pl">'+b.plus_couverts.map(function(x){return '<li><a href="'+sujLien(x)+'">'+esc(x.titre)+'</a> <span class="mono mute">'+pl(x.titres,'titre','titres')+'</span></li>';}).join('')+'</ul>':'<p class="vide">Rien relevé.</p>');
    h+='<p class="lab mono mute">Ce qu’il a laissé de côté</p>'+(b.tus.length?'<ul class="pl">'+b.tus.map(function(x){return '<li><a href="'+sujLien(x)+'">'+esc(x.titre)+'</a> <span class="mono mute">'+x.medias+' médias ailleurs</span></li>';}).join('')+'</ul>':'<p class="vide">Aucun silence sur les grands sujets.</p>');

  });
  h+='</div>';

  h+='<h2>Par journal</h2><p class="note">« Grands sujets » : ceux repris par '+p.min_medias+' médias ou plus. « Dans le top » : présence parmi les '+p.top.length+' sujets les plus couverts.</p>';
  h+='<div class="ptw"><table class="pt"><thead><tr><th scope="col">Journal</th><th scope="col">Bord</th><th scope="col">Titres rangés</th><th scope="col">Grands sujets</th><th scope="col">Dans le top</th></tr></thead><tbody>'+p.medias.map(function(m){
    return '<tr><th scope="row"><a href="#/media/'+enc(m.nom)+'">'+esc(m.nom)+'</a></th><td>'+GL[m.cote]+'</td><td>'+m.titres+'</td><td>'+m.sujets+' sur '+p.larges+'</td><td>'+m.top+' sur '+p.top.length+'</td></tr>';
  }).join('')+'</tbody></table></div>';
  h+='<p class="note">Limites. Un journal absent d’un sujet n’en a peut-être pas parlé, ou son titre n’a pas été rangé sous ce sujet. Deux sujets ouverts séparément sur le même fait sont comptés deux fois. Les journaux dont le flux est illisible n’apparaissent pas.</p>';
  return h;
}

/* éléments communs */
function mdl(){return '<span class="mdl" title="Écrit par un modèle de langage">écrit par un modèle</span>';}
function bchip(b){return '<span class="bchip b-'+b+'">'+BL[b]+'</span>';}
function slots(r){
  var mx=Math.max(r.count.g,r.count.c,r.count.d,1);
  return '<div class="slots">'+['g','c','d'].map(function(x){
    var c=r.count[x];
    return c?'<div class="slot s-'+x+'"><span class="lab">'+GL[x]+'</span><b>'+c+'</b><i style="width:'+Math.max(8,Math.round(100*c/mx))+'%"></i></div>'
            :'<div class="slot zero"><span class="lab">'+GL[x]+'</span><b>silence</b></div>';
  }).join('')+'</div>';
}

function sujetView(r){

  h+='<div class="chips">'+(r.kind==='sujet'?(r.mortes.length?r.mortes.map(function(x){return '<span class="am">Angle mort : '+GL[x].toLowerCase()+'</span>';}).join(' ')+'<span class="note">Aucun média de ce bord n’a de titre rangé sous ce sujet. Comptage par formule fixe.</span>':'<span class="note">Les trois bords ont au moins un titre sur ce sujet.</span>'):'')+'</div>';
  if(r.div!=null){h+='<p><span class="mono">Écart de cadrage</span> <span class="dots" aria-label="'+r.div+' sur 5">'+'●'.repeat(r.div)+'○'.repeat(5-r.div)+'</span> '+r.div+' sur 5'+mdl()+'</p>';}

  h+='<h2>'+(r.kind==='sujet'?'Le même fait, trois formulations':'Les titres, bord par bord')+'</h2><div class="cols">';
  ['g','c','d'].forEach(function(x){
    var list=r.arts.filter(function(a){return a.grp===x;}).sort(function(a,b){return a.score-b.score;});
    var names=Object.keys(r.med[x]);
    h+='<section class="col s-'+x+'"><header><span>'+GL[x]+'</span><span class="mono" style="font-weight:400">'+pl(list.length,'titre','titres')+(names.length?' · '+pl(names.length,'média','médias'):'')+'</span></header><div class="body">';
    if(r.analyse)h+='<div class="angle"><span class="lab mono mute">Angle'+mdl()+'</span>'+esc(r.analyse[x])+'</div>';
    if(!list.length)h+='<div class="silence">Silence : aucun titre'+'<span>'+(r.kind==='sujet'?'Aucun média de ce bord n’apparaît sous ce sujet dans les flux récoltés.':'Aucun titre de ce bord parmi les titres sans jumeau.')+'</span></div>';

    }

/* classement */
function vClass(){
  var min=-3.2,max=2.8,span=max-min;
  function pos(v){return (v-min)/span*100;}
  var h='<p class="crumb"><a href="#/">Sujets</a> / Classement</p><h1 tabindex="-1" id="h1">Le classement des médias</h1>'+
  '<p class="lede" style="font-family:var(--serif);font-size:1.2rem;max-width:56ch">Les '+MEDIAS.length+' médias du panel, situés les uns par rapport aux autres. C’est ce classement, et lui seul, qui range les médias par bord : aucun modèle de langage n’a noté un média.</p>';
  h+='<div class="src"><p><b>Source.</b> FrIdéo v1.0, French News Lab, Amr Sobhy, ICNLSP 2026, licence CC BY 4.0. <a href="https://frenchnewslab.org/fr/publications/frideo-french-news-ideology-scale" target="_blank" rel="noopener noreferrer">frenchnewslab.org ↗</a>. Scores et intervalles du jeu de données officiel publié sur data.gouv.fr.</p>'+
  '<p><b>Réserve.</b> Un journal classé « à gauche » est plus à gauche que les autres journaux du panel. Ça ne veut pas dire qu’il est de gauche. Ce classement peut ne pas correspondre à l’idée que vous vous faites d’un journal. Classer les journaux n’est pas le but de ce site.</p>'+
  '<p><b>Comment lire les scores.</b> Zéro est la moyenne des '+MEDIAS.length+' médias. Les bords sont tirés du score par ce site, avec ces seuils : '+esc(C.seuils.replace(/^bords dérivés du score par nos soins : /,''))+'.</p>'+
  '<p><b>Intervalles de confiance.</b> Le trait fin autour de chaque barre est l’intervalle à 95 % publié par FrIdéo : plus il est long, moins le classement est sûr de la place du journal. Pour '+MEDIAS.filter(function(m){return m.ic&&m.ic[0]<0&&m.ic[1]>0;}).length+' médias sur '+MEDIAS.length+', ce trait traverse la moyenne : le classement ne dit pas de quel côté ils se trouvent. Aucun modèle de langage n’a noté un média.</p></div>';
  h+='<div class="legend">'+BORDS.map(function(b){return '<span><i class="b-'+b+'"></i>'+BL[b]+'</span>';}).join('')+'</div>';
  h+='<div class="axis"><div class="scale"><div></div><div><span style="left:0">← gauche</span><span style="right:0;text-align:right">droite →</span><span style="left:'+pos(0)+'%;transform:translateX(-50%);top:1.5em">moy. panel</span></div><div></div></div>';
  h+='<ul class="cl">'+MEDIAS.slice().sort(function(a,b){return a.score-b.score;}).map(function(m){
    var z=pos(0),p=pos(m.score),l=Math.min(z,p),w=Math.abs(p-z);
    var tk=[-1,-0.5,0.5,1].map(function(t){return '<span class="tick" style="left:'+pos(t)+'%"></span>';}).join('');
    return '<li'+(m.lu?'':' class="off"')+'><div><a href="#/media/'+enc(m.nom)+'">'+esc(m.nom)+'</a>'+'</div><div class="track" role="img" aria-label="'+esc(m.nom)+', score '+fs(m.score)+', '+BL[m.bord]+'">'+tk+'<span class="bar b-'+m.bord+'" style="left:'+l+'%;width:'+w+'%"></span>'+(m.ic?'<span class="ci" style="left:'+pos(m.ic[0])+'%;width:'+(pos(m.ic[1])-pos(m.ic[0]))+'%"></span>':'')+'<span class="zero" style="left:calc('+z+'% - 1px)"></span></div><div class="sc">'+fs(m.score)+'</div></li>';
  }).join('')+'</ul></div>';
  h+='<p class="note">Traits pointillés : les seuils de bord. Trait plein : zéro, la moyenne du panel ; à gauche de ce trait, plus à gauche que cette moyenne. Le nom d’un média ouvre sa fiche.</p>';
  return h;
}

/* médias */
function vMedias(){
  var h='<p class="crumb"><a href="#/">Sujets</a> / Médias</p><h1 tabindex="-1" id="h1">Les médias</h1>'+
  '<p class="lede" style="font-family:var(--serif);font-size:1.2rem;max-width:56ch">Pour chaque média : qui il est dans le classement, ce qu’il a titré aujourd’hui, ce qu’il couvre et ce qu’il ne couvre pas.</p>';
  BORDS.forEach(function(b){
    var l=MEDIAS.filter(function(m){return m.bord===b;}).sort(function(x,y){return x.score-y.score;});
    if(!l.length)return;
    h+='<h2>'+bchip(b)+'</h2><ul class="mlist">'+l.map(function(m){
      return '<li><a class="l-'+m.bord+'" href="#/media/'+enc(m.nom)+'"><b>'+esc(m.nom)+'</b><small>'+fs(m.score)+(m.lu?'':' · illisible')+'</small></a></li>';
    }).join('')+'</ul>';
  });
  return h;
}
function vMedia(nom){
  var m=BY[nom];if(!m)return vMedias();
  var h='<p class="crumb"><a href="#/">Sujets</a> / <a href="#/medias">Médias</a> / '+esc(m.nom)+'</p><h1 tabindex="-1" id="h1">'+esc(m.nom)+'</h1>';
  h+='<p style="margin:14px 0 0"><span class="score">'+fs(m.score)+'</span> '+bchip(m.bord)+'</p>';
  var pos=(m.score+2.6)/4.8*100;
  h+='<div class="mini" role="img" aria-label="Position sur l’axe du panel"><i style="left:calc('+pos+'% - 2px)"></i></div><p class="note" style="display:flex;justify-content:space-between"><span>← plus à gauche que la moyenne</span><span>plus à droite →</span></p>';
  h+='<dl class="kv"><div><dt>D’où vient la note</dt><dd>Classement FrIdéo v1.0 (French News Lab, Amr Sobhy, ICNLSP 2026, CC BY 4.0). Le zéro est la moyenne du panel, pas un centre politique. <a href="#/classement">Voir le classement</a>.</dd></div>'+
  '<div><dt>D’où vient le bord</dt><dd>Dérivé du score par nos soins, avec les seuils du classement. Un modèle de langage n’intervient pas.</dd></div>'+
  '<div><dt>Intervalle de confiance</dt><dd>'+(m.ic?'De '+fs(m.ic[0])+' à '+fs(m.ic[1])+' (à 95 %).'+(m.ic[0]<0&&m.ic[1]>0?' Il traverse la moyenne du panel : le classement ne dit pas de quel côté se trouve ce journal.':'')+(m.sources?' Score établi sur '+m.sources+' familles d’indices sur 9'+(m.peu?', ce qui est peu : à lire avec prudence.':'.'):''):'<span class="soon">à venir</span>')+'</dd></div>'+
  '<div><dt>Propriétaire</dt><dd><span class="soon">à venir</span> <span class="mute">(absent des données)</span></dd></div>'+
  (m.note?'<div><dt>Note sur le flux</dt><dd>'+esc(m.note)+'</dd></div>':'')+
  '<div><dt>Flux du jour</dt><dd>'+(m.lu?'Lu.':'Illisible aujourd’hui : on ne peut rien dire de ce qu’il a titré.')+'</dd></div></dl>';
  /* titres du jour */
  var its=[];rounds.forEach(function(r){r.arts.forEach(function(a){if(a.media===m.nom)its.push({r:r,a:a});});});
  h+='<h2>Ses titres du jour</h2><p class="note">Seulement ceux rangés sous un sujet ou parmi les titres sans jumeau, pas les '+D.total+' récoltés.</p>';
  if(!m.lu)h+='<p class="masked">Aucun : flux illisible.</p>';
  else if(!its.length)h+='<p class="masked">Aucun titre de ce média dans les sujets du jour.</p>';
  else{
    h+='<ul class="tlist">'+its.map(function(x){return '<li><span class="mono mute">'+esc(x.r.titre)+(x.r.kind==='sujet'?mdl():'')+'</span><a class="t" href="'+url(x.a.lien)+'" target="_blank" rel="noopener noreferrer">'+esc(x.a.titre)+' ↗</a></li>';}).join('')+'</ul>';
  }
  /* couverture */
  if(m.lu){
    var cov=[],mute=[];
    var mine={};rounds.forEach(function(r){if(r.kind==='sujet'&&r.arts.some(function(a){return a.media===m.nom;}))mine[r.id]=1;});
    rounds.forEach(function(r){if(r.kind!=='sujet')return;(mine[r.id]?cov:mute).push(r);});
    h+='<h2>Les sujets qu’il couvre</h2>'+(cov.length?'<ul class="tags">'+cov.map(function(r){return '<li><a href="#/sujet/'+r.id+'">'+esc(r.titre)+'</a></li>';}).join('')+'</ul>':'<p class="masked">Aucun parmi les sujets du jour.</p>');
    h+='<h2>Les sujets où il ne figure pas</h2>'+(mute.length?'<ul class="tags">'+mute.map(function(r){return '<li><a href="#/sujet/'+r.id+'">'+esc(r.titre)+'</a></li>';}).join('')+'</ul><p class="note">« Ne figure pas » veut dire : aucun titre de ce média n’a été rangé sous ce sujet. Ce n’est pas la preuve qu’il n’en a jamais parlé.</p>':'<p class="masked">Aucun parmi les sujets du jour.</p>');
  }else{h+='<h2>Les sujets qu’il couvre</h2><p class="masked">Impossible à dire : son flux n’a pas pu être lu.</p>';}
  return h;
}

/* démarche */
function vDemarche(){
  var tot=0;D.sujets.forEach(function(s){tot+=s.articles.length;});
  var dt=new Date(D.recolte).toLocaleString('fr-FR',{timeZone:'Europe/Paris',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var h='<p class="crumb"><a href="#/">Sujets</a> / Démarche</p><h1 tabindex="-1" id="h1">La démarche</h1>'+
  '<p class="lede" style="font-family:var(--serif);font-size:1.2rem;max-width:56ch">Comment les titres arrivent jusqu’à cette page, et ce que chaque étape doit à un modèle de langage ou n’en doit rien.</p>';
  h+='<h2>Pourquoi des titres</h2><p style="max-width:68ch">Un titre est ce que la rédaction choisit de mettre en avant : lire plusieurs titres d’un même fait côte à côte, c’est voir ce que chaque bord retient, avec quels mots, et ce qu’il laisse de côté.</p>';
  h+='<div class="nums"><div><b>'+D.total+'</b><span>titres récoltés sur '+D.heures+' h</span></div><div><b>'+D.medias.length+'</b><span>médias lus sur '+MEDIAS.length+'</span></div><div><b>'+D.sujets.length+'</b><span>sujets, '+tot+' titres rangés</span></div><div><b>'+D.seuls.length+'</b><span>titres sans jumeau</span></div></div>';
  var ry=D.rythme||{};
  h+='<p class="note">Édition du '+esc(jourLong(ED.jour))+', fabriquée le '+esc(dt)+'.'+(ry.recolte_minutes?' Les flux sont lus toutes les '+(ry.recolte_minutes>=60?Math.round(ry.recolte_minutes/60)+' h':ry.recolte_minutes+' min')+'. L’édition est fabriquée une fois par jour, vers '+ry.edition_heure+' h, sur les titres des '+D.heures+' dernières heures. Elle ne bouge plus ensuite.':'')+'</p>';
  h+='<h2>Quatre étapes</h2><ol class="steps">'+
  '<li><h3>Récolte des flux RSS <span class="nomdl">sans modèle</span></h3><p>Un programme lit les flux publics des médias du panel et garde les titres parus dans les '+D.heures+' dernières heures : '+D.total+' titres.</p></li>'+
  '<li><h3>Regroupement en sujets <span class="mdl" style="margin:0">modèle</span></h3><p>Un modèle de langage range les titres qui parlent du même fait sous un même sujet : '+D.sujets.length+' sujets. Ce qui ne se rattache à rien reste « sans jumeau » : '+D.seuls.length+' titres.</p></li>'+
  '<li><h3>Analyse du cadrage <span class="mdl" style="margin:0">modèle</span></h3><p>Pour chaque sujet, le modèle écrit le fait commun, l’angle de chaque bord, les mots qui diffèrent et un écart de cadrage de 0 à 5.</p></li>'+
  '<li><h3>Comptage par bord et angles morts <span class="nomdl">formule fixe, sans modèle</span></h3><p>On compte les titres par bord, à partir du score FrIdéo du média. Un bord est un angle mort sur un sujet quand aucun de ses médias n’a de titre rangé sous ce sujet. Trois bords : gauche (gauche et centre gauche), centre, droite (centre droit et droite).</p></li></ol>';
  h+='<h2>Ce qu’un modèle fait, et ne fait pas</h2><div class="two"><div><h3>Il fait</h3><ul><li>Regrouper des titres en sujets.</li><li>Décrire, à partir des seuls titres, l’angle de chaque bord.</li><li>Repérer des mots qui diffèrent.</li></ul></div><div><h3>Il ne fait pas</h3><ul><li>Il ne note jamais un média : les notes viennent du classement FrIdéo.</li><li>Il ne place aucun média sur l’axe gauche-droite.</li><li>Il ne lit pas les articles.</li></ul></div></div>';
  h+='<p style="max-width:68ch;margin-top:14px">Les sujets, les faits communs, les analyses et les mots sont écrits par Claude, à partir des seuls titres. Chaque passage ainsi produit porte l’étiquette <span class="mdl" style="margin:0">écrit par un modèle</span>.</p>';
  h+='<h2>Les limites</h2><ul class="lim" style="max-width:68ch"><li><b>Des titres, pas des articles.</b> Un titre peut être plus neutre ou plus appuyé que le texte qu’il coiffe.</li><li><b>Un seul jour</b>, le '+esc(new Date(D.recolte).toLocaleDateString('fr-FR',{timeZone:'Europe/Paris'}))+', sur '+D.heures+' h. Un silence aujourd’hui n’est pas un silence habituel.</li>'+(D.absents.length?'<li><b>'+(D.absents.length>1?D.absents.length+' flux illisibles':'Un flux illisible')+' :</b> '+D.absents.map(esc).join(', ')+'. Leur silence n’est donc pas compté comme un silence, et ils sont absents des comptages par bord.</li>':'')+'<li><b>Les bords sont à nous :</b> dérivés du score par des seuils, regroupés en trois pour la lecture.</li></ul>';
  h+='<p class="note" style="margin-top:20px">Le classement est détaillé ici : <a href="#/classement">le classement des médias</a>. Les idées dont cette page s’inspire : <a href="#/origine">d’où vient l’idée</a>.</p>';
  return h;
}

/* origine */
function vOrigine(){
  return '<p class="crumb"><a href="#/">Sujets</a> / Origine</p><h1 tabindex="-1" id="h1">D’où vient l’idée</h1>'+
  '<p class="lede" style="font-family:var(--serif);font-size:1.2rem;max-width:56ch">Comparer la couverture d’un même sujet selon le bord des médias n’est pas une idée neuve. Deux projets nous ont montré la voie. Nous les citons avec estime, et nous n’avons repris ni leur habillage ni leurs textes.</p>'+
  '<div class="origin"><article><span class="for">Pour le principe</span><h2 style="margin:.6rem 0 .4rem">Ground News</h2><p>Mettre côte à côte la manière dont des médias de bords différents traitent un même sujet, et rendre visible ce qu’un bord laisse de côté : ce geste de lecture, ils l’ont rendu simple et courant. C’est de là que vient la comparaison par bord et l’attention portée aux silences.</p><p><a href="https://ground.news/rating-system" target="_blank" rel="noopener noreferrer">ground.news/rating-system ↗</a></p></article>'+
  '<article><span class="for">Pour la méthode</span><h2 style="margin:.6rem 0 .4rem">AllSides</h2><p>Exposer, page à l’appui, comment on évalue le positionnement d’un média, en croisant plusieurs approches plutôt qu’en assénant une note. Leur exigence de transparence est la nôtre : ici chaque classement dit d’où il vient, et chaque texte écrit par un modèle le dit aussi.</p><p><a href="https://www.allsides.com/about/media-bias-rating-methods" target="_blank" rel="noopener noreferrer">allsides.com/about/media-bias-rating-methods ↗</a></p></article></div>'+
  '<h2>Ce que cette page fait autrement</h2><ul class="lim" style="max-width:68ch"><li>Elle met chaque fait en regard, bord par bord, avec les angles morts et les mots qui diffèrent.</li><li>Elle ne note aucun média elle-même : le classement vient de FrIdéo (<a href="#/classement">détails</a>).</li><li>Elle sépare ce qui est compté par formule de ce qui est écrit par un modèle (<a href="#/demarche">la démarche</a>).</li></ul>';
}

/* routage */
var app=document.getElementById('app');
function route(opt){
  var hsh=location.hash.replace(/^#\/?/,'');var parts=hsh.split('/');var v=parts[0]||'home';var html,nav=v;
  if(v==='sujet'){html=vRound(parts[1]);nav='home';}
  else if(v==='media'){html=vMedia(decodeURIComponent(parts.slice(1).join('/')));nav='medias';}
  else if(v==='medias')html=vMedias();
  else if(v==='classement')html=vClass();
  else if(v==='demarche')html=vDemarche();
  else if(v==='origine')html=vOrigine();
  else if(v==='editions'){html=vEditions();nav='home';}
  else if(v==='semaine'||v==='mois'){html=vPeriode(v);nav='home';}
  else{html=vHome();nav='home';}
  var y=window.scrollY;
  app.innerHTML=html;
  document.querySelectorAll('nav.main a').forEach(function(a){if(a.getAttribute('data-nav')===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  if(opt&&opt.keep){window.scrollTo(0,y);if(opt.focus){var f=app.querySelector(opt.focus);if(f)f.focus({preventScroll:true});}}
  else{window.scrollTo(0,0);var h1=document.getElementById('h1')||app.querySelector('h1');if(h1){h1.setAttribute('tabindex','-1');h1.focus({preventScroll:true});}}
  document.title=(app.querySelector('h1')?app.querySelector('h1').textContent.replace(/écrit par un modèle/,'').trim()+' · ':'')+'Cadrages';
}
window.addEventListener('hashchange',function(){route();});

function effDark(){return S.theme?S.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function applyTheme(){var d=document.documentElement;if(S.theme)d.setAttribute('data-theme',S.theme);else d.removeAttribute('data-theme');
  var b=document.getElementById('btnTheme');b.textContent=effDark()?'Thème : sombre':'Thème : clair';}
document.getElementById('btnTheme').addEventListener('click',function(){S.theme=effDark()?'light':'dark';save();applyTheme();});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(_){}

document.getElementById('foot').innerHTML='<p><span class="mdl" style="margin:0">écrit par un modèle</span> signale tout texte rédigé par un modèle de langage (sujets, faits, angles, mots). Les scores viennent de FrIdéo v1.0 (French News Lab, CC BY 4.0), les comptages d’une formule fixe. Données du '+esc(new Date(D.recolte).toLocaleDateString('fr-FR',{timeZone:'Europe/Paris'}))+'. Aucune donnée n’est envoyée : seul le choix du thème reste dans votre navigateur.</p>';
applyTheme();route();
})();
</script>
